     场的识别色竖线、编号徽章），视觉上仍然是一个完整的作品。
     带 scripting 的浏览器完全不会渲染 <noscript> 的内容，因此它与地图层
     可以共存于同一份 HTML。
     ⚠️ 此处的地标名 / 副标题是静态 HTML —— 没有 JS 就读不到 site.data.js，
        这是无 JS 档位无法回避的重复。修改 site.data.js 时请同步这一节。

<!-- ══════════════════════════════════════════════════════════════════════════
     DOM 骨架（契约 §3.1）
     ⚠️ #map-controls / #hero-caption 的内容由 app.js 生成 ——
        这样在"无 JS"档位下它们不会留下一堆点不动的死控件。
     ══════════════════════════════════════════════════════════════════════════ -->
<div id="app">

  <!-- L0/L1 地图画布：纸张底纹之上绘制统一高度场与流动等高线。
       Canvas 内容对辅助技术不可见，语义由 #landmark-layer 的按钮承载。 -->
  <canvas id="map-canvas" aria-hidden="true"></canvas>

  <!-- L2/L3 地标层：真实可聚焦的按钮，供键盘导航与无障碍 -->
  <div id="landmark-layer" tabindex="-1">
    <div id="map-world"></div>
  </div>

  <!-- L4 时间控件 / 比例尺 / 图廓坐标 / 签名 -->
  <div id="map-controls"></div>

  <!-- 左上角引导文案（文案来自 site.data.js 的 hero.*） -->
  <div id="hero-caption"></div>

  <!-- L5 覆盖层，初始隐藏。Agent D 只允许操作 #overlay-content 内部（契约 §3.1）。
       #overlay-title 由 Agent C 提供，Agent D 请勿重复创建同 id 元素。 -->
  <div id="overlay" data-state="closed" role="dialog" aria-modal="true" tabindex="-1"
       aria-labelledby="overlay-title" aria-hidden="true">
    <span class="m-overlay__title" id="overlay-title"></span>
    <div id="overlay-content" data-field=""></div>
  </div>

  <!-- L6 错误 / 提示 -->
  <div id="global-message" role="status" aria-live="polite"></div>

  <!-- 顶层纸张颗粒：把 UI 与画布统一成同一张纸（装饰） -->
  <div id="paper-grain" aria-hidden="true"></div>
</div>

<script>
(function(){
  var hour=new Date().getHours();
  var dark=hour<6||hour>=18;
  var root=document.documentElement;
  root.setAttribute('data-theme',dark?'dark':'light');
  root.setAttribute('data-mode',dark?'night':'day');
  root.setAttribute('data-theme-mode',dark?'night':'day');
  root.setAttribute('data-time-of-day',dark?'night':'day');
  root.classList.toggle('is-dark',dark);
  root.classList.toggle('is-light',!dark);
  root.classList.toggle('dark-mode',dark);
  root.classList.toggle('light-mode',!dark);
  root.classList.toggle('is-night',dark);
  root.classList.toggle('is-day',!dark);
  function syncBody(){
    if(!document.body)return;
    document.body.setAttribute('data-theme',dark?'dark':'light');
    document.body.setAttribute('data-mode',dark?'night':'day');
    document.body.setAttribute('data-theme-mode',dark?'night':'day');
    document.body.setAttribute('data-time-of-day',dark?'night':'day');
    document.body.classList.toggle('is-dark',dark);
    document.body.classList.toggle('is-light',!dark);
    document.body.classList.toggle('dark-mode',dark);
    document.body.classList.toggle('light-mode',!dark);
    document.body.classList.toggle('is-night',dark);
    document.body.classList.toggle('is-day',!dark);
  }
  if(document.body)syncBody();else document.addEventListener('DOMContentLoaded',syncBody,{once:true});
}());
</script>

<script>
(function(){
  var replacement='为什么棒球是最好的运动？<br>因为别的运动都没有棒球棒！';
  function isLeaf(el){return el.children.length===0&&el.textContent.trim();}
  function compactTarget(el){
    var target=el;
    while(target.parentElement&&target.parentElement!==document.body&&target.parentElement.children.length<=2&&target.parentElement.textContent.trim()===target.textContent.trim())target=target.parentElement;
    return target;
  }
  function cleanField(){
    var field=document.querySelector('.f-room,.field-room,[data-room="field"],#field-room')||document.body;
    field.querySelectorAll('*').forEach(function(el){
      if(!isLeaf(el))return;
      var text=el.textContent.trim();
      if(text==='我和棒垒'||text.indexOf('我和棒垒')===0){
        compactTarget(el).setAttribute('data-ui-corner-hidden','true');
      }else if(text.indexOf('选择场上的一个位置')!==-1){
        compactTarget(el).setAttribute('data-ui-corner-hidden','true');
      }else if(text.indexOf('回到球场')!==-1||text.indexOf('球还没到')!==-1||text.indexOf('其他运动都没有棒球棒')!==-1||text.indexOf('别的运动都没有棒球棒')!==-1){
        el.innerHTML=replacement;
      }
    });
  }
  function cleanHome(){
    return;
    document.querySelectorAll('body *').forEach(function(el){
      if(!isLeaf(el))return;
      var text=el.textContent.trim();
      if(!text||text.indexOf('坐标之外')!==-1)return;
      if(text.indexOf('时区')!==-1||text.indexOf('当前时间')!==-1||text.indexOf('太阳位置')!==-1||text.indexOf('时间调整')!==-1){
        compactTarget(el).setAttribute('data-ui-corner-hidden','true');
        return;
      }
      var parent=el.closest('button,a,[role="button"]');
      if(parent)return;
      var anchor=el;
      while(anchor.parentElement&&anchor!==document.body&&getComputedStyle(anchor).position==='static')anchor=anchor.parentElement;
      var style=getComputedStyle(anchor);
      if(style.position!=='fixed'&&style.position!=='absolute')return;
      var rect=anchor.getBoundingClientRect();
      var nearLeft=rect.left<90,nearRight=rect.right>innerWidth-90,nearTop=rect.top<90,nearBottom=rect.bottom>innerHeight-90;
      var isSmallLayer=rect.width<innerWidth*.55&&rect.height<innerHeight*.55;
      if(anchor===document.body||anchor.id==='app'||anchor.tagName==='MAIN'||!isSmallLayer)return;
      if((nearLeft||nearRight)&&(nearTop||nearBottom))anchor.setAttribute('data-ui-corner-hidden','true');
    });
  }
  function clean(){
    document.querySelectorAll('[data-ui-corner-hidden]').forEach(function(el){el.removeAttribute('data-ui-corner-hidden');});
    cleanField();
  }
  function install(){return;}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',install,{once:true});else install();
}());
</script>

    document.querySelectorAll('body *').forEach(function(el){
      if(el.children.length||!el.textContent.trim())return;
      var text=el.textContent.trim();
      if(text!=='关于'&&text!=='印记')return;
      var target=el.closest('button,a,[role="button"]');
      if(!target)target=el.parentElement&&el.parentElement!==document.body&&el.parentElement.children.length<=3?el.parentElement:el;
      target.style.display='none';
    });
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){setTimeout(removeAboutAndMark,1200);},{once:true});else setTimeout(removeAboutAndMark,1200);
}());
</script>
